spring.application.name=edu

server.port=8080


// Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/plataforma_academica
spring.datasource.username=root
spring.datasource.password=1234

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Configuración de Swagger/OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# JWT settings (example secret - replace with environment secret in production)
jwt.secret=ThisIsAChangeMeSecretKey_ReplaceWithSecureRandomValue_AtLeast32Bytes
jwt.expiration-ms=3600000